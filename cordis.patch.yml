# gitlab-todo-agent bundle patch
#
# 供 `dsh plugin --profile web add <路径>` 自动挂载（Loader bundle 层）；
# 手动挂载的用户也可在 profiles/web/cordis.patch.yml 自行添加 insert 条目。
# name 必须与 package.json 的 name 完全一致，否则启用时按包名 import 会失败。
- insert:
    - id: gitlab-todo-agent
      name: '@lifeipkg/dsh-gitlab-todo-agent'
      config:
        requestTimeoutMs: 90000
        maxOutputBytes: 2097152
